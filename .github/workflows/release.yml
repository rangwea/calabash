name: Check Electron app

on:
  push:
    branches: [main, v1.3.0]
    tags: ['v1.3.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Electron ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Install locked Calabash dependencies
        run: |
          npm ci
          uv sync --frozen
      - name: Prepare pinned DSH
        run: npm run electron:prepare
      - name: Build Electron sources
        run: npm run electron:build
      - name: Check Python tool services
        run: uv run --frozen python -m unittest discover -s tests
      - name: Check host and synthetic Agent
        run: npm run test:harness
      # This validates sources, not installers. Packaging must first include
      # Calabash's Python and frontend runtimes with installed-path acceptance.
      # Do not attach incomplete upstream DSH installers to a Release.
