[package]
name = "calabash-desktop"
version = "1.2.0"
description = "Calabash desktop shell"
license = "Elastic-2.0"
authors = ["Calabash"]
edition = "2021"
autobins = false

[[bin]]
name = "Calabash"
path = "src/main.rs"

[lib]
name = "calabash_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
