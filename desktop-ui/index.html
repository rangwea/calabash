<!doctype html>
<html lang="zh-CN">

    <title>Calabash</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="window-frame" data-tauri-drag-region></div>

    </main>
    <script type="module" src="/src/main.js"></script>
