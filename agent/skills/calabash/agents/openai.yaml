interface:
  display_name: "Calabash"
  short_description: "Build and debug local Calabash tools"
  default_prompt: "Use $calabash to create, edit, validate, and debug local Calabash utilities under ~/.calabash/tools. Read the bundled runtime contract and prefer built-in libraries without asking app users to install system tools. Planned capability packs are not installed capabilities. Use local files or SQLite only, preview when verification is requested, and overwrite or delete a formal tool only after explicit confirmation."
policy:
  allow_implicit_invocation: true
