[project]
name = "calabash"
version = "1.3.1"
description = "Calabash local AI tool desktop"
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.0",
    "httpx>=0.28.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "cryptography>=41.0.0",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "Pillow>=11.0.0",
    "reportlab>=4.0.0",
    "pypdfium2>=4.0.0",
]

[dependency-groups]
packaging = [
    "pyinstaller>=6.10.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py313"
line-length = 200
exclude = ["build", "dist", "website", "agent", ".venv"]

[tool.ruff.lint]
# F: pyflakes (undefined names, unused imports), E9/F63/F7: real defects, I: import order.
select = ["F", "E9", "I"]
