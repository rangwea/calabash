<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Calabash workflow demonstration</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#263238;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,textarea{font:inherit}header{height:40px;border-bottom:1px solid #edf0ee;display:flex;align-items:center;padding:0 16px;gap:7px}.dot{width:10px;height:10px;border-radius:50%;background:#ff6058}.dot:nth-child(2){background:#ffbd2e}.dot:nth-child(3){background:#28c840}header small{margin-left:auto;color:#85918b;font-size:10px}aside{position:absolute;top:40px;bottom:0;width:150px;background:#f6f7f6;padding:22px 12px;border-right:1px solid #ecefec}.brand{font-weight:650;font-size:17px;margin-bottom:28px}.search{border:1px solid #e3e8e4;border-radius:7px;padding:7px 9px;font-size:11px;color:#9aa39e;margin-bottom:20px}.nav.active{background:#e7ebe8}aside p{font-size:10px;color:#929b96;margin-top:35px}aside .recent{font-size:11px;padding:0;line-height:1.5}
.tool-item{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:7px;font-size:11px;color:#3e5049}
.tool-item.active{background:#e7ebe8}
.tool-dot{width:6px;height:6px;border-radius:50%;background:#377360;flex-shrink:0}
.tool-empty{font-size:10px;color:#a4ada7;padding:0 9px;line-height:1.7}.workspace{position:absolute;left:150px;right:0;top:40px;bottom:0;display:flex}.chat{position:relative;flex:1;min-width:0;padding:24px 28px}.chat-title{font-size:12px;font-weight:600}.welcome{position:absolute;top:190px;left:24px;right:24px;text-align:center}.welcome h1{font-size:28px;letter-spacing:-1px;margin-bottom:12px}.welcome p{color:#8b9690;font-size:12px}.messages{padding-top:70px;max-width:560px;margin:auto}.user{background:#edf3f0;padding:14px 16px;border-radius:14px 14px 3px 14px;margin-left:20px;line-height:1.8;font-size:13px}.agent{margin-top:32px;font-size:12px;line-height:1.9}.agent-label{font-size:10px;letter-spacing:.5px;font-weight:650;color:#87928b;margin-bottom:8px}.activity{display:flex;gap:8px;align-items:center;margin-top:20px;color:#7a8880;font-size:11px}.spinner{height:13px;width:13px;border-radius:50%;border:2px solid #d7e4dc;border-top-color:#377360}.tool-chip{border:1px solid #dde6e0;border-radius:8px;padding:12px;margin-top:15px;display:flex;gap:10px;align-items:center;color:#3e6553}.tool-chip small{display:block;font-size:10px;color:#8a968f;margin-top:4px}.composer{position:absolute;left:28px;right:28px;bottom:28px;border:1px solid #dfe5e0;border-radius:15px;padding:16px;box-shadow:0 6px 25px #233d2d08;background:white}.draft{height:62px;font-size:13px;line-height:1.8;white-space:pre-wrap}.placeholder{color:#9aa39e}.composer-bottom{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#929c96}.send{background:#284d3d;color:white;width:28px;height:28px;border:0;border-radius:8px;font-size:21px}.cursor{border-right:1px solid #37604c}.preview{display:none;width:710px;border-left:1px solid #e4e9e5;background:#fafbfc;flex-shrink:0}.preview-top{height:41px;border-bottom:1px solid #e9ede9;background:white;padding:13px 15px;display:flex;justify-content:space-between;font-size:11px}.preview img{width:100%;height:auto;display:block}.preview-note{margin:24px 18px;padding:13px;border-top:1px solid #e2e9e3;font-size:11px;color:#708579;display:flex;justify-content:space-between}.split .preview{display:block}.split .chat{padding:24px 18px}.split .messages{padding-top:38px}.split .user{font-size:11px;padding:12px;margin-left:0}.split .agent{font-size:11px;margin-top:23px}.split .composer{left:16px;right:16px;bottom:25px;padding:13px}.split .draft{font-size:11px;height:54px}.split .chat-title{font-size:11px}
</style>
<header><span class="dot"></span><span class="dot"></span><span class="dot"></span><small id="disclosure"></small></header>
<aside><div class="brand">Calabash</div><div class="search" id="search"></div><p id="list-label"></p><div id="tool-list"><div class="tool-item active" id="tool-item" hidden><span class="tool-dot"></span><span id="recent"></span></div><div class="tool-empty" id="tool-empty"></div></div></aside>
<div class="workspace" id="workspace"><section class="chat"><div class="chat-title" id="chat-title"></div><div class="welcome" id="welcome"><h1 id="welcome-title"></h1><p id="welcome-subtitle"></p></div><div class="messages" id="messages" hidden><div class="user" id="user"></div><div class="agent" id="agent"><div class="agent-label">CALABASH</div><div id="response"></div><div class="activity" id="activity"><span class="spinner"></span><span id="activity-text"></span></div><div class="tool-chip" id="tool-chip" hidden><span>▤</span><div><strong id="tool-name"></strong><small id="saved"></small></div></div></div></div><div class="composer"><div class="draft" id="draft"></div><div class="composer-bottom"><span>＋ &nbsp; ◇ &nbsp; DeepSeek</span><button class="send">↑</button></div></div></section><section class="preview"><div class="preview-top"><span id="preview-title"></span><span>↻ &nbsp; ↗ &nbsp; ×</span></div><img id="recording" alt="Actual tool recording"><div class="preview-note"><span id="operation"></span><span id="step"></span></div></section></div>
<script>
window.showcase = ({language, prompt, title, phase, draft='', image='', step=0}) => {
  const en=language==='en';
  document.documentElement.lang=en?'en':'zh-CN';
  const set=(id,zh,english)=>document.getElementById(id).textContent=en?english:zh;
  set('disclosure','界面示意 · 非真实录屏','Interface illustration · Not a screen recording');
  set('search','搜索工具','Search tools');
  set('list-label','工具列表','TOOLS');
  const listed=phase!=='typing';
  document.getElementById('tool-item').hidden=!listed;
  if(listed)document.getElementById('recent').textContent=title;
  const empty=document.getElementById('tool-empty');
  empty.hidden=listed;empty.textContent=en?'No tools yet. Describe one in the chat.':'还没有工具。在对话里描述一个试试。';
  set('chat-title','对话','Conversation');set('welcome-title','想做一件什么工具？','What would you like to build?');set('welcome-subtitle','描述需求，AI 会在右侧生成工具。','Describe it and AI builds the tool on the right.');
  const typing=phase==='typing';
  document.getElementById('welcome').hidden=!typing;document.getElementById('messages').hidden=typing;
  document.getElementById('user').textContent=prompt;
  const draftNode=document.getElementById('draft');draftNode.textContent=typing?draft:(en?'Describe what you want to change…':'描述你想调整的地方…');draftNode.className='draft '+(typing?'cursor':'placeholder');
  const ready=phase==='ready'||phase==='tool';
  set('response',ready?'工具已准备好。在右侧预览中试用，也可以继续对话调整。':'我会按你的需求创建工具，把输入、操作和结果放在同一个工作区。',ready?'Your tool is ready. Try it in the preview, or keep chatting to refine it.':'I’ll build a workspace with inputs, controls and results for your request.');
  document.getElementById('activity').hidden=ready;
  set('activity-text',phase==='sent'?'整理需求…':'创建界面与处理逻辑…',phase==='sent'?'Understanding the request…':'Building the interface and processing logic…');
  document.getElementById('tool-chip').hidden=!ready;document.getElementById('tool-name').textContent=title;set('saved','已保存为本地工具','Saved as a local tool');
  document.getElementById('workspace').classList.toggle('split',ready);set('preview-title','工具预览','Tool preview');
  if(image)document.getElementById('recording').src=image;
  set('operation',phase==='ready'?'生成完成 → 开始试用':'界面示意',phase==='ready'?'Ready → Try the tool':'Interface illustration');
  document.getElementById('step').textContent=step?`${step} / 6`:'';
};
</script>
</html>
